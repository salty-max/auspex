services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: auspex
      POSTGRES_PASSWORD: auspex
      POSTGRES_DB: auspex
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auspex']
      interval: 2s
      timeout: 5s
      retries: 10
